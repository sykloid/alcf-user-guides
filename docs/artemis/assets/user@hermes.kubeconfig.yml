apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://hermes.lab.alcf.anl.gov:6443
  name: hermes
contexts:
- context:
    cluster: hermes
    namespace: default
    user: user@hermes
  name: user@hermes
current-context: user@hermes
kind: Config
users:
- name: user@hermes
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - oidc-login
      - get-token
      - --oidc-issuer-url=https://keycloak.alcf.anl.gov/realms/hermes
      - --oidc-client-id=hermes-kubectl
      - --oidc-pkce-method=S256
      - --listen-address=localhost:18712
      command: kubectl
      env: null
      interactiveMode: IfAvailable
      provideClusterInfo: false
