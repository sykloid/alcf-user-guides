apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://nepenthes-ctrl-01.lab.alcf.anl.gov:6443
  name: nepenthes
contexts:
- context:
    cluster: nepenthes
    namespace: default
    user: user@nepenthes
  name: user@nepenthes
current-context: user@nepenthes
kind: Config
users:
- name: user@nepenthes
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - oidc-login
      - get-token
      - --oidc-issuer-url=https://keycloak.alcf.anl.gov/realms/nepenthes
      - --oidc-client-id=nepenthes-kubectl
      - --oidc-pkce-method=S256
      - --listen-address=localhost:18712
      command: kubectl
      env: null
      interactiveMode: IfAvailable
      provideClusterInfo: false
